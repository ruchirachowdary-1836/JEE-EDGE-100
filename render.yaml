# Render Blueprint: New > Blueprint > select this repo.
# Creates a Node web service and a PostgreSQL database. Set SEED_ADMIN_PASSWORD before the first deploy.
databases:
  - name: jee-edge-db
    plan: free
    databaseName: jee_edge
    user: jee

services:
  - type: web
    name: jee-edge-100
    runtime: node
    plan: free
    # migrate + seed run during the build (pre-deploy commands need a paid plan); the seed is idempotent
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run db:seed && npm run build
    startCommand: npx next start -p $PORT
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: jee-edge-db
          property: connectionString
      - key: SEED_ADMIN_EMAIL
        value: admin@jee-edge.local
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_STUDENT_PASSWORD
        sync: false
